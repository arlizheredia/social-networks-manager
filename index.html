<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Social Networks Manager</title>
    <meta name="description" content="Publica en tus grupos de Facebook y analiza los comentarios de Facebook, Instagram y TikTok desde una sola app. Todo en tu navegador, con un solo modelo de IA local." />
    <meta name="theme-color" content="#0b57d0" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono&display=swap" />
    <link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=block" />
    <script>
      // Aplica el tema antes de pintar para evitar parpadeos
      try { var t = localStorage.getItem('snm.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t } catch (e) {}
    </script>
    <style>
      /* Pantalla de carga inicial: mismos colores y animación que la app, antes de que cargue el CSS */
      :root { --bg: #f8fafd; --primary: #0b57d0; --primary-container: #d3e3fd; --text-2: #444746; }
      @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #131314; --primary: #a8c7fa; --primary-container: #0842a0; --text-2: #c4c7c5; } }
      :root[data-theme="dark"] { --bg: #131314; --primary: #a8c7fa; --primary-container: #0842a0; --text-2: #c4c7c5; }
      body { margin: 0; background: var(--bg); }
      .boot { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 16px; font: 14px Roboto, system-ui, sans-serif; color: var(--text-2); }
      .boot .snm-loader { position: relative; width: 72px; height: 72px; }
      .boot .snm-loader-ring { position: absolute; inset: 0; width: 72px; height: 72px; animation: boot-rotate 1.4s linear infinite; }
      .boot .snm-loader-track { fill: none; stroke: var(--primary-container); stroke-width: 4; }
      .boot .snm-loader-arc { fill: none; stroke: var(--primary); stroke-width: 4; stroke-linecap: round; stroke-dasharray: 1 176; animation: boot-dash 1.4s ease-in-out infinite; }
      .boot .snm-loader-logo { position: absolute; inset: 16px; width: 40px; height: 40px; animation: boot-pulse 1.4s ease-in-out infinite; }
      @keyframes boot-rotate { to { transform: rotate(360deg); } }
      @keyframes boot-dash { 0% { stroke-dasharray: 1 176; stroke-dashoffset: 0; } 50% { stroke-dasharray: 110 176; stroke-dashoffset: -30; } 100% { stroke-dasharray: 110 176; stroke-dashoffset: -175; } }
      @keyframes boot-pulse { 0%, 100% { transform: scale(.92); } 50% { transform: scale(1); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-label="Cargando Social Networks Manager">
        <div class="snm-loader">
          <svg viewBox="0 0 64 64" class="snm-loader-ring" aria-hidden="true"><circle cx="32" cy="32" r="28" class="snm-loader-track" /><circle cx="32" cy="32" r="28" class="snm-loader-arc" /></svg>
          <img src="./icon.svg" alt="" class="snm-loader-logo" />
        </div>
        <span>Cargando…</span>
      </div>
    </div>
    <noscript>Social Networks Manager necesita JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
